<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Indicadores de Transporte</title>
    
    <!-- Import Map para resolver dependencias inyectadas por Babel (jsx-runtime) -->
    <script type="importmap">
    {
        "imports": {
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime"
        }
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Babel (Transpilador JSX) -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9;}
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line, ComposedChart } from 'https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0';

        // --- ÍCONOS SVG NATIVOS OPTIMIZADOS ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const TrendingUp = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></Icon>;
        const Users = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
        const Bus = (p) => <Icon {...p}><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></Icon>;
        const Calendar = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Icon>;
        const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
        const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
        const UploadCloud = (p) => <Icon {...p}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></Icon>;
        const FileSpreadsheet = (p) => <Icon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></Icon>;
        const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
        const MapIcon = (p) => <Icon {...p}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></Icon>;
        const Sparkles = (p) => <Icon {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Icon>;
        const Bot = (p) => <Icon {...p}><rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" x2="8" y1="16" y2="16"/><line x1="16" x2="16" y1="16" y2="16"/></Icon>;
        const Loader2 = (p) => <Icon {...p} className={`animate-spin ${p.className || ''}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
        const BarChart2 = (p) => <Icon {...p}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></Icon>;
        const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;

        // --- CONFIGURACIÓN PRINCIPAL ---
        const apiKey = ""; 

        const EXTENDED_PALETTE = ['#2A4B54', '#279A55', '#9BB7D4', '#8A7E9A', '#6D213C', '#FDF1B8', '#3D5A80', '#D4D5D8', '#145C33', '#6B8EAD', '#496F5D', '#0891b2', '#059669', '#0284c7'];
        const getYearColor = (year, idx) => EXTENDED_PALETTE[parseInt(year, 10) % EXTENDED_PALETTE.length] || EXTENDED_PALETTE[idx % EXTENDED_PALETTE.length];
        
        const DAY_COLORS = { 'HAB': '#2A4B54', 'SAB': '#9BB7D4', 'DOM': '#3D5A80' };
        const INDICATOR_COLORS = { ali: '#279A55', troncal: '#2A4B54', articulado: '#2A4B54', padron: '#9BB7D4', buseton: '#059669', tpc: '#8A7E9A', general: '#3D5A80' };
        const MONTHS_ORDER = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

        // Utilidades de Parseo y Texto
        const parseCSVLine = (text, sep) => {
            const result = [];
            let current = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === sep && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        };

        const formatMarkdown = (text) => text.split('\n').map((line, i) => !line.trim() ? <br key={i} /> : <p key={i} dangerouslySetInnerHTML={{ __html: line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') }} className="mb-2 text-slate-700 leading-relaxed" />);

        const App = () => {
            const [rawData, setRawData] = useState([]);
            const [isLoaded, setIsLoaded] = useState(false);
            const [uploadError, setUploadError] = useState('');
            const [selectedYears, setSelectedYears] = useState([]);
            const [selectedDayType, setSelectedDayType] = useState('Todos');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [showYearDropdown, setShowYearDropdown] = useState(false);
            const [logoError, setLogoError] = useState(false);
            const [aiInsight, setAiInsight] = useState('');
            const [isGeneratingAI, setIsGeneratingAI] = useState(false);
            const [aiError, setAiError] = useState('');

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = null;
                setUploadError('');

                if (file.name.toLowerCase().endsWith('.xlsx') || file.name.toLowerCase().endsWith('.xls')) {
                    setUploadError("❌ Subiste un archivo Excel binario. Guárdalo como 'CSV (delimitado por comas)'.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const text = evt.target.result;
                        if (text.indexOf('\u0000') !== -1) {
                            setUploadError("❌ El archivo contiene caracteres binarios. Guárdalo estrictamente como texto plano CSV.");
                            return;
                        }

                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        if (lines.length < 2) throw new Error("Archivo sin datos");

                        const separator = lines[0].includes(';') ? ';' : ',';
                        const headers = parseCSVLine(lines[0], separator).map(h => h.toUpperCase().trim());
                        
                        const colIdx = {
                            ano: headers.findIndex(h => h === 'YEAR' || h === 'AÑO' || h === 'ANO' || (h.includes('A') && h.includes('O') && h.length <= 5)),
                            mes: headers.findIndex(h => h.includes('MES')),
                            tipoDia2: headers.findIndex(h => h.includes('TIPO DÍA 2') || h.includes('TIPO DIA 2')),
                            tipDia: headers.findIndex(h => h.includes('TIP') && h.includes('DIA')),
                            validaciones: headers.findIndex(h => h.includes('VALIDACION')),
                            ali: headers.findIndex(h => h.includes('%ALI')),
                            troncal: headers.findIndex(h => h.includes('%TRONCAL')),
                            demanda_troncal: headers.findIndex(h => h === 'TRONCAL'),
                            demanda_ali: headers.findIndex(h => h === 'ALIMENTACIÓN' || h === 'ALIMENTACION'),
                            ipb_a: headers.findIndex(h => h === 'IPB_A' || h === 'IPA_A'),
                            ipb_p: headers.findIndex(h => h === 'IPB_P'),
                            ipb_b: headers.findIndex(h => h === 'IPB_B'),
                            ipb_tpc: headers.findIndex(h => h === 'IPB_TPC'),
                            ipb_sist: headers.findIndex(h => h.includes('IPB SIST') || h === 'IPB'),
                            ikb_a: headers.findIndex(h => h === 'IKB_A' || h === 'IKA_A'),
                            ikb_p: headers.findIndex(h => h === 'IKB_P'),
                            ikb_b: headers.findIndex(h => h === 'IKB_B'),
                            ikb_tpc: headers.findIndex(h => h === 'IKB_TPC'),
                            ikb_sist: headers.findIndex(h => { const c = h.replace(/_/g, ' '); return c === 'IKB SIST' || c === 'IKB GENERAL' || c === 'IKB'; }),
                            kms: headers.findIndex(h => { const c = h.replace(/_/g, ' '); return c.includes('KMS EJEC') && !c.includes('ALI') && !c.includes('TRONCAL'); }),
                            kms_ali: headers.findIndex(h => { const clean = h.replace(/[^A-Z0-9]/g, ''); return clean.includes('KMSEJECALI') || clean.includes('KMSALI') || clean.includes('ALITPC'); }),
                            kms_troncal: headers.findIndex(h => { const clean = h.replace(/[^A-Z0-9]/g, ''); return clean.includes('KMSEJECTRONCAL') || clean.includes('KMSTRONCAL'); }),
                            kms_prog: headers.findIndex(h => h.includes('KMS PROG') || h.includes('KMS_PROG')),
                            flota: headers.findIndex(h => h.includes('FLOTA_EJEC') || h.includes('FLOTA EJEC')),
                            flota_blanca: headers.findIndex(h => { const c = h.replace(/[^A-Z0-9]/g, ''); return c.includes('FLOTATMEJEC') || c.includes('FLOTABLANCA'); }),
                            flota_azul: headers.findIndex(h => { const c = h.replace(/[^A-Z0-9]/g, ''); return c.includes('FLOTAGASEJEC') || c.includes('FLOTAAZUL'); }),
                            flota_tpc_new: headers.findIndex(h => { const c = h.replace(/[^A-Z0-9]/g, ''); return c.includes('FLOTATPCEJEC'); }),
                            cumpl_a: headers.findIndex(h => h.includes('CUMPLDESPACH_A')),
                            cumpl_p: headers.findIndex(h => h.includes('CUMPLDESPACH_P')),
                            cumpl_b: headers.findIndex(h => h.includes('CUMPLDESPACH_B')),
                            cumpl_tpc: headers.findIndex(h => h.includes('CUMPLDESPACH_TPC')),
                            punt_sis: headers.findIndex(h => h.includes('PUNTUALIDAD_SIS')),
                            punt_met: headers.findIndex(h => h.includes('PUNTUALIDAD_MET')),
                            punt_tpc: headers.findIndex(h => h.includes('PUNTUALIDAD_TPC'))
                        };

                        if (colIdx.ano === -1 || colIdx.mes === -1 || colIdx.validaciones === -1) throw new Error("Faltan columnas obligatorias.");

                        const parsedData = [];
                        for (let i = 1; i < lines.length; i++) {
                            const values = parseCSVLine(lines[i], separator);
                            const anoStr = values[colIdx.ano], mesStr = values[colIdx.mes];
                            if (!anoStr || !mesStr) continue;

                            const ano = parseInt(anoStr.replace(/[^0-9]/g, ''));
                            const mes = mesStr.toLowerCase().trim();
                            if (isNaN(ano) || !MONTHS_ORDER.includes(mes)) continue;

                            let tipDia = 'HAB';
                            const valRaw = ((colIdx.tipDia !== -1 ? values[colIdx.tipDia] : '') + (colIdx.tipoDia2 !== -1 ? values[colIdx.tipoDia2] : '')).toUpperCase().trim();
                            if (valRaw === 'S' || valRaw.includes('SAB')) tipDia = 'SAB';
                            else if (valRaw === 'D' || valRaw.includes('DOM') || valRaw.includes('FES') || valRaw.includes('CARNAVAL')) tipDia = 'DOM';

                            const getNum = (idx) => {
                                if (idx === -1 || !values[idx]) return 0;
                                // Limpieza estricta: confiando en que el CSV original viene con formato de punto decimal nativo sin comas
                                let str = String(values[idx]).trim().replace(/%/g, '').replace(/\s/g, '');
                                if (!str) return 0;
                                
                                const val = parseFloat(str);
                                return isNaN(val) ? 0 : val;
                            };

                            parsedData.push({
                                Año: ano, mes: mes, Tip_dia: tipDia, Validaciones: getNum(colIdx.validaciones),
                                Demanda_Troncal: getNum(colIdx.demanda_troncal), Demanda_Ali: getNum(colIdx.demanda_ali),
                                '%ALI': getNum(colIdx.ali), '%TRONCAL': getNum(colIdx.troncal),
                                IPB_A: getNum(colIdx.ipb_a), IPB_P: getNum(colIdx.ipb_p), IPB_B: getNum(colIdx.ipb_b), IPB_TPC: getNum(colIdx.ipb_tpc), 'IPB SIST': getNum(colIdx.ipb_sist),
                                IKB_A: getNum(colIdx.ikb_a), IKB_P: getNum(colIdx.ikb_p), IKB_B: getNum(colIdx.ikb_b), IKB_TPC: getNum(colIdx.ikb_tpc), 'IKB SIST': getNum(colIdx.ikb_sist),
                                KMS_EJEC: getNum(colIdx.kms), KMS_ALI: getNum(colIdx.kms_ali), KMS_TRONCAL: getNum(colIdx.kms_troncal), KMS_PROG: getNum(colIdx.kms_prog), FLOTA_EJEC: getNum(colIdx.flota),
                                FLOTA_BLANCA: getNum(colIdx.flota_blanca), FLOTA_AZUL: getNum(colIdx.flota_azul), FLOTA_TPC_NEW: getNum(colIdx.flota_tpc_new),
                                cumpl_a: getNum(colIdx.cumpl_a), cumpl_p: getNum(colIdx.cumpl_p), cumpl_b: getNum(colIdx.cumpl_b), cumpl_tpc: getNum(colIdx.cumpl_tpc),
                                punt_sis: getNum(colIdx.punt_sis), punt_met: getNum(colIdx.punt_met), punt_tpc: getNum(colIdx.punt_tpc)
                            });
                        }

                        if (parsedData.length === 0) throw new Error("Sin datos válidos");

                        setRawData(parsedData);
                        setIsLoaded(true);
                        const availableYrs = Array.from(new Set(parsedData.map(d => d.Año.toString()))).sort().reverse();
                        setSelectedYears(availableYrs.slice(0, 2));

                    } catch (err) {
                        console.error(err);
                        setUploadError("❌ Error procesando CSV: " + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const availableYears = Array.from(new Set(rawData.map(d => d.Año.toString()))).sort().reverse();

            // --- PROCESAMIENTO DE DATOS OPTIMIZADO ---
            const filterByYear = (data) => data.filter(d => selectedYears.includes(d.Año.toString()));
            const filterByDay = (data) => selectedDayType === 'Todos' ? data : data.filter(d => d.Tip_dia === selectedDayType);
            
            const activeData = useMemo(() => filterByDay(filterByYear(rawData)), [rawData, selectedYears, selectedDayType]);
            const habOnlyData = useMemo(() => filterByYear(rawData).filter(d => d.Tip_dia === 'HAB'), [rawData, selectedYears]);

            const buildTimeSeries = (sourceData, metricProcessor) => {
                const grouped = [];
                [...selectedYears].sort().forEach(year => {
                    MONTHS_ORDER.forEach(month => {
                        const matches = sourceData.filter(d => d.Año.toString() === year && d.mes === month);
                        if (matches.length > 0) {
                            const result = metricProcessor(matches, month, year);
                            if (result) grouped.push({ label: `${month.slice(0,3)} '${year.slice(-2)}`, name: month.charAt(0).toUpperCase() + month.slice(1, 3), ...result });
                        }
                    });
                });
                return grouped;
            };

            // Gráficas 1 & 2: Evolución Demanda
            const monthlyTotalData = useMemo(() => buildTimeSeries(filterByYear(rawData), (m, month, year) => ({ [year]: m.reduce((a, b) => a + b.Validaciones, 0) })).reduce((acc, curr) => {
                const existing = acc.find(item => item.name === curr.name);
                if (existing) Object.assign(existing, curr); else acc.push(curr);
                return acc;
            }, []), [rawData, selectedYears, isLoaded]);

            const getDailyAvg = (type) => buildTimeSeries(filterByYear(rawData).filter(d => d.Tip_dia === type), (m, month, year) => ({ [year]: Math.round(m.reduce((a, b) => a + b.Validaciones, 0) / m.length) })).reduce((acc, curr) => {
                const existing = acc.find(item => item.name === curr.name);
                if (existing) Object.assign(existing, curr); else acc.push(curr);
                return acc;
            }, []);
            
            const habData = useMemo(() => getDailyAvg('HAB'), [rawData, selectedYears, isLoaded]);
            const sabData = useMemo(() => getDailyAvg('SAB'), [rawData, selectedYears, isLoaded]);
            const domData = useMemo(() => getDailyAvg('DOM'), [rawData, selectedYears, isLoaded]);

            // Gráfica 3: Cumplimiento de Despachos (Sanado)
            const cumplimientoData = useMemo(() => buildTimeSeries(activeData, (m, month, year) => {
                if (parseInt(year, 10) < 2023) return null;
                const getValidAvg = (key) => {
                    const valid = m.filter(d => d[key] > 0);
                    if (!valid.length) return null;
                    let avg = valid.reduce((a, b) => a + b[key], 0) / valid.length;
                    if (avg > 0 && avg <= 1.5) avg *= 100;
                    return avg > 100 ? 100 : Number(avg.toFixed(2));
                };
                return { articulado: getValidAvg('cumpl_a'), padron: getValidAvg('cumpl_p'), buseton: getValidAvg('cumpl_b'), tpc: getValidAvg('cumpl_tpc') };
            }), [activeData]);

            // Gráfica 4: Puntualidad (Sanado y Filtrado a Nov 2025)
            const getPuntualidadData = (type) => buildTimeSeries(filterByYear(rawData).filter(d => d.Tip_dia === type), (m, month, year) => {
                if (parseInt(year, 10) < 2025 || (parseInt(year, 10) === 2025 && MONTHS_ORDER.indexOf(month) < 10)) return null;
                const getValidAvg = (key) => {
                    const valid = m.filter(d => d[key] > 0);
                    if (!valid.length) return null;
                    let avg = valid.reduce((a, b) => a + b[key], 0) / valid.length;
                    if (avg > 0 && avg <= 1.5) avg *= 100;
                    return avg > 100 ? 100 : Number(avg.toFixed(2));
                };
                return { sistur: getValidAvg('punt_sis'), metrocaribe: getValidAvg('punt_met'), tpc: type !== 'DOM' ? getValidAvg('punt_tpc') : null };
            });
            const puntualidadHabData = useMemo(() => getPuntualidadData('HAB'), [rawData, selectedYears, isLoaded]);
            const puntualidadSabData = useMemo(() => getPuntualidadData('SAB'), [rawData, selectedYears, isLoaded]);
            const puntualidadDomData = useMemo(() => getPuntualidadData('DOM'), [rawData, selectedYears, isLoaded]);

            // Gráfica 5: Flota por Tecnología (Barras Apiladas)
            const flotaTecnologiaData = useMemo(() => buildTimeSeries(habOnlyData, m => {
                const avg = k => m.reduce((a, b) => a + b[k], 0) / m.length;
                const blanca = avg('FLOTA_BLANCA'), azul = avg('FLOTA_AZUL'), tpc = avg('FLOTA_TPC_NEW');
                if (blanca || azul || tpc) return { blanca: Number(blanca.toFixed(1)), azul: Number(azul.toFixed(1)), tpc: Number(tpc.toFixed(1)) };
                return null;
            }), [habOnlyData]);

            // Demás Gráficas Evolutivas
            const sistemaTrendData = useMemo(() => buildTimeSeries(filterByYear(rawData), m => {
                const habM = m.filter(d => d.Tip_dia === 'HAB');
                const avg = k => habM.length ? habM.reduce((a, b) => a + b[k], 0) / habM.length : 0;
                return { kmsAli: Math.round(avg('KMS_ALI')), kmsTroncal: Math.round(avg('KMS_TRONCAL')), demTroncal: Math.round(avg('Demanda_Troncal')), demAli: Math.round(avg('Demanda_Ali')) };
            }), [rawData, selectedYears]);

            const distribucionTrendData = useMemo(() => buildTimeSeries(activeData, m => {
                const avg = k => m.reduce((a, b) => a + b[k], 0) / m.length;
                const rawAli = avg('%ALI'), rawTroncal = avg('%TRONCAL');
                return { ali: Number((rawAli > 1.5 ? rawAli : rawAli * 100).toFixed(2)), troncal: Number((rawTroncal > 1.5 ? rawTroncal : rawTroncal * 100).toFixed(2)) };
            }), [activeData]);

            const ofertaTrendData = useMemo(() => buildTimeSeries(habOnlyData, m => ({
                kms: Math.round(m.reduce((a, b) => a + b.KMS_EJEC, 0) / m.length), flota: Math.round(m.reduce((a, b) => a + b.FLOTA_EJEC, 0) / m.length)
            })), [habOnlyData]);

            const monthlyTotalsTrendData = useMemo(() => buildTimeSeries(filterByYear(rawData), m => ({
                kmsTotal: Math.round(m.reduce((a, b) => a + b.KMS_EJEC, 0)), kmsProgTotal: Math.round(m.reduce((a, b) => a + b.KMS_PROG, 0)), validacionesTotal: Math.round(m.reduce((a, b) => a + b.Validaciones, 0))
            })), [rawData, selectedYears]);

            const ipkTrendData = useMemo(() => buildTimeSeries(filterByYear(rawData), m => {
                const getIpk = arr => arr.reduce((a, b) => a + b.KMS_EJEC, 0) > 0 ? arr.reduce((a, b) => a + b.Validaciones, 0) / arr.reduce((a, b) => a + b.KMS_EJEC, 0) : null;
                return { general: Number(getIpk(m)?.toFixed(2)), hab: Number(getIpk(m.filter(d => d.Tip_dia === 'HAB'))?.toFixed(2)), sab: Number(getIpk(m.filter(d => d.Tip_dia === 'SAB'))?.toFixed(2)), dom: Number(getIpk(m.filter(d => d.Tip_dia === 'DOM'))?.toFixed(2)) };
            }), [rawData, selectedYears]);

            const ipbTipologiasTrendData = useMemo(() => buildTimeSeries(activeData, (m, month, year) => {
                if (parseInt(year, 10) < 2022) return null;
                const getValidAvg = k => {
                    const valid = m.filter(d => d[k] > 0);
                    return valid.length ? valid.reduce((a, b) => a + b[k], 0) / valid.length : null;
                };
                return { 
                    ipb_a: getValidAvg('IPB_A') !== null ? Number(getValidAvg('IPB_A').toFixed(1)) : null, 
                    ipb_p: getValidAvg('IPB_P') !== null ? Number(getValidAvg('IPB_P').toFixed(1)) : null, 
                    ipb_b: getValidAvg('IPB_B') !== null ? Number(getValidAvg('IPB_B').toFixed(1)) : null, 
                    ipb_tpc: getValidAvg('IPB_TPC') !== null ? Number(getValidAvg('IPB_TPC').toFixed(1)) : null 
                };
            }), [activeData]);

            const ipbGeneralTrendData = useMemo(() => buildTimeSeries(activeData, m => {
                const valid = m.filter(d => d['IPB SIST'] > 0);
                return valid.length ? { ipb_sist: Number((valid.reduce((a, b) => a + b['IPB SIST'], 0) / valid.length).toFixed(1)) } : null;
            }), [activeData]);

            const ikbTipologiasTrendData = useMemo(() => buildTimeSeries(activeData, (m, month, year) => {
                if (parseInt(year, 10) < 2022) return null;
                const getValidAvg = k => {
                    const valid = m.filter(d => d[k] > 0);
                    return valid.length ? valid.reduce((a, b) => a + b[k], 0) / valid.length : null;
                };
                return { 
                    ikb_a: getValidAvg('IKB_A') !== null ? Number(getValidAvg('IKB_A').toFixed(1)) : null, 
                    ikb_p: getValidAvg('IKB_P') !== null ? Number(getValidAvg('IKB_P').toFixed(1)) : null, 
                    ikb_b: getValidAvg('IKB_B') !== null ? Number(getValidAvg('IKB_B').toFixed(1)) : null, 
                    ikb_tpc: getValidAvg('IKB_TPC') !== null ? Number(getValidAvg('IKB_TPC').toFixed(1)) : null 
                };
            }), [activeData]);

            const ikbGeneralTrendData = useMemo(() => buildTimeSeries(activeData, m => {
                const valid = m.filter(d => d['IKB SIST'] > 0);
                return valid.length ? { ikb_sist: Number((valid.reduce((a, b) => a + b['IKB SIST'], 0) / valid.length).toFixed(1)) } : null;
            }), [activeData]);

            // Tabla Resumen
            const tableData = useMemo(() => selectedYears.map(year => ({
                year, months: MONTHS_ORDER.map(month => {
                    const habM = rawData.filter(d => d.Año.toString() === year && d.mes === month && d.Tip_dia === 'HAB');
                    const sabM = rawData.filter(d => d.Año.toString() === year && d.mes === month && d.Tip_dia === 'SAB');
                    const domM = rawData.filter(d => d.Año.toString() === year && d.mes === month && d.Tip_dia === 'DOM');
                    const hab = habM.length ? habM.reduce((a, b) => a + b.Validaciones, 0) / habM.length : 0;
                    const sab = sabM.length ? sabM.reduce((a, b) => a + b.Validaciones, 0) / sabM.length : 0;
                    const dom = domM.length ? domM.reduce((a, b) => a + b.Validaciones, 0) / domM.length : 0;
                    return { month, hab: Math.round(hab), sab: Math.round(sab), dom: Math.round(dom), pctSab: hab ? ((sab/hab)*100).toFixed(1) : '0', pctDom: hab ? ((dom/hab)*100).toFixed(1) : '0' };
                }).filter(m => m.hab || m.sab || m.dom)
            })), [rawData, selectedYears]);

            const generateAIInsight = async () => {
                if (!selectedYears.length) return;
                setIsGeneratingAI(true); setAiError(''); setAiInsight('');
                const prompt = `Analiza este sistema de transporte: Años ${selectedYears.join(', ')}. \nDatos: ${JSON.stringify({demanda: monthlyTotalData.slice(-12), eficiencia: monthlyTotalsTrendData.slice(-12), ipk: ipkTrendData.slice(-12)})}\nResumen Ejecutivo estructurado en:\n**1. Tendencias de Demanda:**\n**2. Eficiencia Operativa:**\n**3. Recomendación Estratégica:**`;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                    if (!res.ok) throw new Error("Error HTTP");
                    setAiInsight((await res.json()).candidates[0].content.parts[0].text);
                } catch (e) { setAiError('Error al generar el reporte.'); }
                setIsGeneratingAI(false);
            };

            const toggleYear = (year) => setSelectedYears(prev => prev.includes(year) ? prev.filter(y => y !== year) : [...prev, year]);
            const formatNumber = (num) => new Intl.NumberFormat('es-CO').format(num);

            if (!isLoaded) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 text-slate-800">
                        <div className="bg-white p-12 rounded-3xl shadow-xl max-w-lg w-full text-center border border-slate-200">
                            <div className="bg-slate-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6"><FileSpreadsheet size={48} className="text-[#0d1e2b]" /></div>
                            <h1 className="text-3xl font-black mb-3 text-[#0d1e2b]">Cargar Datos Operativos</h1>
                            <p className="text-slate-500 mb-8 text-sm">Sube tu archivo formato <strong>CSV (Delimitado por comas)</strong>.</p>
                            <label className="cursor-pointer bg-[#0d1e2b] text-white px-8 py-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-[#1a3a54] transition-all shadow-lg"><UploadCloud size={24} /> Seleccionar CSV<input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} /></label>
                            {uploadError && <div className="mt-6 bg-blue-50 text-blue-700 p-4 rounded-xl flex items-start gap-3 text-left text-sm font-medium"><AlertCircle size={20} className="shrink-0" /> {uploadError}</div>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen text-slate-900 pb-12">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                {!logoError ? <img src="logo.png" alt="Transmetro" className="h-12 object-contain" onError={() => setLogoError(true)} /> : <div className="bg-[#0d1e2b] p-2 rounded-lg shadow-md"><Bus className="text-white" size={24} /></div>}
                                <div className="h-10 w-px bg-slate-200"></div>
                                <div><h1 className="text-xl font-black text-[#0d1e2b] tracking-tight">Indicadores de Gestión</h1><p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">{rawData.length.toLocaleString('es-CO')} registros</p></div>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="relative">
                                    <button onClick={() => setShowYearDropdown(!showYearDropdown)} className="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50"><Calendar size={16} /> Años ({selectedYears.length})</button>
                                    {showYearDropdown && (
                                        <div className="absolute top-full right-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-xl p-2 z-30 max-h-64 overflow-y-auto">
                                            {availableYears.map(year => <button key={year} onClick={() => toggleYear(year)} className="w-full flex items-center justify-between px-3 py-2 hover:bg-slate-50 rounded-lg text-sm font-medium">{year} {selectedYears.includes(year) && <Check size={16} className="text-[#0d1e2b]" />}</button>)}
                                        </div>
                                    )}
                                </div>
                                <select className="bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold shadow-sm outline-none" value={selectedDayType} onChange={(e) => setSelectedDayType(e.target.value)}>
                                    <option value="Todos">Filtro: Todos</option><option value="HAB">Hábiles</option><option value="SAB">Sábados</option><option value="DOM">Dominicales</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 mt-8 space-y-8">
                        <div className="flex justify-between items-center gap-4">
                            <div className="flex bg-white p-1 rounded-2xl shadow-sm border border-slate-200">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-6 py-2 rounded-xl text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-[#0d1e2b] text-white' : 'text-slate-500'}`}>Infografía</button>
                                <button onClick={() => setActiveTab('tables')} className={`px-6 py-2 rounded-xl text-sm font-bold transition-all ${activeTab === 'tables' ? 'bg-[#0d1e2b] text-white' : 'text-slate-500'}`}>Tablas Resumen</button>
                            </div>
                            <button onClick={generateAIInsight} disabled={isGeneratingAI} className={`flex items-center gap-2 px-6 py-2.5 rounded-2xl text-sm font-bold transition-all shadow-md ${isGeneratingAI ? 'bg-slate-100 text-slate-400' : 'bg-gradient-to-r from-[#0d1e2b] to-[#2A4B54] text-white hover:scale-[1.02]'}`}>
                                {isGeneratingAI ? <Loader2 size={18} /> : <Sparkles size={18} />} {isGeneratingAI ? 'Generando...' : 'Analizar con IA'}
                            </button>
                        </div>

                        {(aiInsight || aiError) && (
                            <div className="bg-gradient-to-br from-slate-50 to-blue-50 p-6 rounded-3xl border border-blue-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-[#0d1e2b] opacity-5 rounded-full blur-3xl -mr-10 -mt-10" />
                                <div className="flex items-center gap-3 mb-4"><div className="bg-[#0d1e2b] p-2 rounded-xl"><Bot className="text-white" size={24} /></div><h3 className="text-xl font-black text-slate-800">Resumen Ejecutivo</h3></div>
                                {aiError ? <p className="text-blue-600 font-medium text-sm flex items-center gap-2"><AlertCircle size={16}/> {aiError}</p> : <div className="text-sm">{formatMarkdown(aiInsight)}</div>}
                            </div>
                        )}

                        {activeTab === 'dashboard' ? (
                            <div className="grid grid-cols-1 gap-8">
                                
                                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Users size={20} className="text-[#0d1e2b]" /> Evolución Mensual de Demanda (Suma Total)</h3><p className="text-xs font-medium text-slate-500 ml-7">Suma total de validaciones sin discriminar por tipo de día</p></div>
                                    <div className="h-80">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={monthlyTotalData}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 12, fontWeight: 600}} />
                                                <YAxis axisLine={false} tickLine={false} tickFormatter={(val) => val >= 1000000 ? `${(val/1000000).toFixed(1)}M` : `${(val/1000).toFixed(0)}k`} width={60} />
                                                <Tooltip cursor={{fill: '#f8fafc'}} formatter={(val) => [formatNumber(val), "Validaciones"]} />
                                                <Legend />
                                                {selectedYears.map((year, idx) => <Bar key={year} dataKey={year} fill={getYearColor(year, idx)} radius={[4, 4, 0, 0]} barSize={35} name={year} />)}
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Calendar size={20} className="text-[#3D5A80]" /> Demanda Promedio Diaria</h3><p className="text-xs font-medium text-slate-500 ml-7">Comparativa interanual desagregada por tipo de día</p></div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {[ { title: 'Días Hábiles', data: habData }, { title: 'Sábados', data: sabData }, { title: 'Domingos y Festivos', data: domData } ].map((item, i) => (
                                            <div key={i} className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                <h4 className="text-sm font-bold text-slate-700 mb-4 text-center">{item.title}</h4>
                                                <div className="h-60">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <LineChart data={item.data} margin={{top: 5, right: 10, left: -20, bottom: 0}}>
                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                                            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 10}} />
                                                            <YAxis axisLine={false} tickLine={false} tick={{fontSize: 10}} tickFormatter={(val) => val >= 1000 ? `${(val/1000).toFixed(0)}k` : val} />
                                                            <Tooltip formatter={(val) => [formatNumber(val), "Promedio Diario"]} />
                                                            <Legend wrapperStyle={{fontSize: '10px'}} />
                                                            {selectedYears.map((year, idx) => <Line key={year} type="monotone" dataKey={year} name={year} stroke={getYearColor(year, idx)} strokeWidth={2} dot={{r: 3}} connectNulls />)}
                                                        </LineChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Check size={20} className="text-[#279A55]" /> Cumplimiento de Despachos por Tipología</h3><p className="text-xs font-medium text-slate-500 ml-7">Promedio del cumplimiento (%). Aplica filtro superior.</p></div>
                                    <div className="h-72">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ComposedChart data={cumplimientoData}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                <YAxis domain={[0, 100]} axisLine={false} tickLine={false} />
                                                <Tooltip />
                                                <Legend />
                                                <Bar dataKey="articulado" name="Articulado" fill={INDICATOR_COLORS.articulado} radius={[4, 4, 0, 0]} barSize={15} />
                                                <Bar dataKey="padron" name="Padrón" fill={INDICATOR_COLORS.padron} radius={[4, 4, 0, 0]} barSize={15} />
                                                <Bar dataKey="buseton" name="Busetón" fill={INDICATOR_COLORS.buseton} radius={[4, 4, 0, 0]} barSize={15} />
                                                <Bar dataKey="tpc" name="TPC" fill={INDICATOR_COLORS.tpc} radius={[4, 4, 0, 0]} barSize={15} />
                                            </ComposedChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Clock size={20} className="text-[#6D213C]" /> Puntualidad por Concesionario</h3><p className="text-xs font-medium text-slate-500 ml-7">Escala de 0 a 100%.</p></div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {[ { title: 'Días Hábiles', data: puntualidadHabData }, { title: 'Sábados', data: puntualidadSabData }, { title: 'Domingos y Festivos', data: puntualidadDomData } ].map((item, i) => (
                                            <div key={i} className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                <h4 className="text-sm font-bold text-slate-700 mb-4 text-center">{item.title}</h4>
                                                <div className="h-60">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        {item.data.length > 0 ? (
                                                            <LineChart data={item.data} margin={{top: 5, right: 10, left: -20, bottom: 0}}>
                                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                                                <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                                <YAxis domain={[0, 100]} axisLine={false} tickLine={false} tick={{fontSize: 10}} />
                                                                <Tooltip />
                                                                <Legend wrapperStyle={{fontSize: '10px'}} />
                                                                <Line type="monotone" dataKey="sistur" name="Sistur" stroke="#2A4B54" strokeWidth={2} dot={{r: 2}} connectNulls />
                                                                <Line type="monotone" dataKey="metrocaribe" name="Metrocaribe" stroke="#279A55" strokeWidth={2} dot={{r: 2}} connectNulls />
                                                                {item.title !== 'Domingos y Festivos' && <Line type="monotone" dataKey="tpc" name="TPC" stroke="#6D213C" strokeWidth={2} dot={{r: 2}} connectNulls />}
                                                            </LineChart>
                                                        ) : <div className="h-full w-full flex items-center justify-center text-slate-400 text-sm">Sin datos</div>}
                                                    </ResponsiveContainer>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Bus size={20} className="text-[#0d1e2b]" /> Flota Promedio Ejecutada por Tecnología</h3><p className="text-xs font-medium text-slate-500 ml-7">Distribución en Días Hábiles (Flota Blanca, Gas y TPC).</p></div>
                                        <div className="h-80">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={flotaTecnologiaData}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis axisLine={false} tickLine={false} />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Bar dataKey="blanca" name="Flota Blanca" stackId="a" fill="#D4D5D8" barSize={35} />
                                                    <Bar dataKey="azul" name="Flota Azul (Gas)" stackId="a" fill="#0284c7" barSize={35} />
                                                    <Bar dataKey="tpc" name="Flota TPC" stackId="a" fill="#8A7E9A" radius={[4, 4, 0, 0]} barSize={35} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>

                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Activity size={20} className="text-[#9BB7D4]" /> Evolución Operativa Sistémica</h3><p className="text-xs font-medium text-slate-500 ml-7">Kms y Flota diarios (Hábiles).</p></div>
                                        <div className="h-80">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={ofertaTrendData} margin={{ top: 5, right: 10, left: 10, bottom: 0 }}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis yAxisId="left" axisLine={false} tickLine={false} tickFormatter={(val) => val >= 1000 ? `${(val/1000).toFixed(0)}k` : val} />
                                                    <YAxis yAxisId="right" orientation="right" axisLine={false} tickLine={false} />
                                                    <Tooltip formatter={(val, name) => [formatNumber(val), name]} />
                                                    <Legend />
                                                    <Line yAxisId="left" type="monotone" dataKey="kms" name="Kilómetros Promedio" stroke="#9BB7D4" strokeWidth={3} dot={false} />
                                                    <Line yAxisId="right" type="monotone" dataKey="flota" name="Flota Promedio" stroke="#2A4B54" strokeWidth={3} strokeDasharray="3 3" dot={false} />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><BarChart2 size={20} className="text-[#2A4B54]" /> Demanda vs Kms por Componente</h3><p className="text-xs font-medium text-slate-500 ml-7">Promedio Diario Hábil.</p></div>
                                    <div className="h-80">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ComposedChart data={sistemaTrendData} margin={{ top: 5, right: 10, left: 10, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                <YAxis yAxisId="left" axisLine={false} tickLine={false} tickFormatter={(val) => val >= 1000000 ? `${(val/1000000).toFixed(1)}M` : (val >= 1000 ? `${(val/1000).toFixed(0)}k` : val)} />
                                                <YAxis yAxisId="right" orientation="right" axisLine={false} tickLine={false} tickFormatter={(val) => val >= 1000000 ? `${(val/1000000).toFixed(1)}M` : (val >= 1000 ? `${(val/1000).toFixed(0)}k` : val)} />
                                                <Tooltip formatter={(val, name) => [formatNumber(val), name]} />
                                                <Legend />
                                                <Bar yAxisId="left" dataKey="demTroncal" name="Dem. Troncal" fill={INDICATOR_COLORS.troncal} fillOpacity={0.6} radius={[4, 4, 0, 0]} barSize={25} />

                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={distribucionTrendData}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis domain={[0, 100]} axisLine={false} tickLine={false} unit="%" />
                                                    <Tooltip formatter={(val) => [`${val}%`]} />

                                                    <Line type="monotone" dataKey="ali" name="% Alimentación" stroke={INDICATOR_COLORS.ali} strokeWidth={3} dot={false} />
                                                    <Line type="monotone" dataKey="troncal" name="% Troncal" stroke={INDICATOR_COLORS.troncal} strokeWidth={3} dot={false} />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>

                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><TrendingUp size={20} className="text-[#2A4B54]" /> Tendencia IPK Promedio</h3><p className="text-xs font-medium text-slate-500 ml-7">Evolución sistémica y por tipo de día</p></div>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={ipkTrendData} margin={{ top: 5, right: 10, left: 10, bottom: 0 }}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis axisLine={false} tickLine={false} tick={{fontSize: 10}} />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Line type="monotone" dataKey="general" name="Sistémico" stroke="#64748b" strokeWidth={4} dot={false} />
                                                    <Line type="monotone" dataKey="hab" name="Hábiles" stroke={DAY_COLORS.HAB} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="sab" name="Sábados" stroke={DAY_COLORS.SAB} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="dom" name="Dom/Fest" stroke={DAY_COLORS.DOM} strokeWidth={2} dot={false} connectNulls />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><TrendingUp size={20} className="text-[#0369a1]" /> Índice Pasajeros/Bus (IPB) Tipologías</h3><p className="text-xs font-medium text-slate-500 ml-7">Años ≥ 2022.</p></div>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={ipbTipologiasTrendData}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis axisLine={false} tickLine={false} />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Line type="monotone" dataKey="ipb_a" name="Articulado" stroke={INDICATOR_COLORS.articulado} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="ipb_p" name="Padrón" stroke={INDICATOR_COLORS.padron} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="ipb_b" name="Busetón" stroke={INDICATOR_COLORS.buseton} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="ipb_tpc" name="TPC" stroke={INDICATOR_COLORS.tpc} strokeWidth={2} dot={false} connectNulls />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>

                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><TrendingUp size={20} className="text-[#0d1e2b]" /> IPB General del Sistema</h3><p className="text-xs font-medium text-slate-500 ml-7">Todos los años seleccionados.</p></div>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={ipbGeneralTrendData}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis axisLine={false} tickLine={false} />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Line type="monotone" dataKey="ipb_sist" name="Sist. General" stroke={INDICATOR_COLORS.general} strokeWidth={4} dot={false} connectNulls />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Activity size={20} className="text-[#0891b2]" /> Índice Kms/Bus (IKB) Tipologías</h3><p className="text-xs font-medium text-slate-500 ml-7">Años ≥ 2022.</p></div>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={ikbTipologiasTrendData}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis axisLine={false} tickLine={false} />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Line type="monotone" dataKey="ikb_a" name="Articulado" stroke={INDICATOR_COLORS.articulado} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="ikb_p" name="Padrón" stroke={INDICATOR_COLORS.padron} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="ikb_b" name="Busetón" stroke={INDICATOR_COLORS.buseton} strokeWidth={2} dot={false} connectNulls />
                                                    <Line type="monotone" dataKey="ikb_tpc" name="TPC" stroke={INDICATOR_COLORS.tpc} strokeWidth={2} dot={false} connectNulls />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>

                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6"><h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><Activity size={20} className="text-[#0d1e2b]" /> IKB General del Sistema</h3><p className="text-xs font-medium text-slate-500 ml-7">Todos los años seleccionados.</p></div>
                                        <div className="h-72">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={ikbGeneralTrendData}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={0} angle={-45} textAnchor="end" height={50} />
                                                    <YAxis axisLine={false} tickLine={false} />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Line type="monotone" dataKey="ikb_sist" name="Sist. General" stroke={INDICATOR_COLORS.general} strokeWidth={4} dot={false} connectNulls />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-12">
                                {tableData.map(yearGroup => (
                                    <div key={yearGroup.year} className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                                        <div className="px-8 py-6 bg-slate-50 border-b border-slate-200 flex justify-between items-center"><h3 className="text-xl font-black text-slate-800">Resumen Demanda Diaria - {yearGroup.year}</h3></div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm">
                                                <thead>
                                                    <tr className="bg-white border-b border-slate-100 uppercase text-[10px] font-black text-slate-400 tracking-widest">
                                                        <th className="px-8 py-5">Mes</th><th className="px-6 py-5 border-l border-slate-100">Hábiles</th><th className="px-6 py-5">Sábados</th><th className="px-6 py-5">Dom/Fest</th>
                                                        <th className="px-6 py-5 bg-slate-50/50 text-slate-700 border-l border-slate-100">% Sáb vs Háb</th><th className="px-6 py-5 bg-slate-50/50 text-slate-700">% Dom vs Háb</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {yearGroup.months.map(row => (
                                                        <tr key={row.month} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-8 py-4 font-bold text-slate-700 capitalize">{row.month}</td>
                                                            <td className="px-6 py-4 font-medium text-slate-600 border-l border-slate-100">{formatNumber(row.hab)}</td><td className="px-6 py-4 font-medium text-slate-600">{formatNumber(row.sab)}</td><td className="px-6 py-4 font-medium text-slate-600">{formatNumber(row.dom)}</td>
                                                            <td className="px-6 py-4 font-black text-slate-600 bg-slate-50/20 border-l border-slate-100">{row.pctSab}%</td><td className="px-6 py-4 font-black text-slate-600 bg-slate-50/20">{row.pctDom}%</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
